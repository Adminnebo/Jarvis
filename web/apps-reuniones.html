<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b1b">
  <title>Reuniones · Jarvis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/apps/reuniones.css">
</head>
<body>
  <header class="jarvis-barra">
    <a href="/" class="jarvis-volver" aria-label="Volver a Jarvis">&larr; Jarvis</a>
    <span class="jarvis-titulo">Reuniones</span>
  </header>
  <main class="reuniones">
    <div class="columna">
      <section id="presencial" class="presencial" aria-label="Grabar una reunión en persona">
        <button id="presencial-empezar" type="button" class="boton-grabar">
          <span class="punto" aria-hidden="true"></span> Grabar reunión presencial
        </button>
        <div id="presencial-grabando" class="presencial-grabando" hidden>
          <p class="presencial-titulo" id="presencial-titulo"></p>
          <p class="reloj" id="presencial-reloj">00:00</p>
          <div class="nivel" aria-hidden="true"><span id="presencial-nivel"></span></div>
          <p class="nota" id="presencial-nota"></p>
          <button id="presencial-terminar" type="button">Terminar</button>
        </div>
        <p class="mensaje" id="presencial-mensaje" role="status"></p>
      </section>
      <section id="en-curso" class="en-curso" aria-label="Grabando ahora" hidden></section>
      <form id="grabar-link" class="grabar-link">
        <label for="link-meet">Grabar un Meet que no está en el calendario</label>
        <div class="fila-form">
          <input id="link-meet" name="url" type="url" inputmode="url" required placeholder="Pega el link del Meet" autocomplete="off">
          <button type="submit">Grabar</button>
        </div>
        <p class="mensaje" id="mensaje-link" role="status"></p>
      </form>
      <aside id="lista" aria-label="Reuniones grabadas"></aside>
    </div>
    <section id="detalle" aria-live="polite"><p class="vacio">Elige una reunión.</p></section>
  </main>
  <dialog id="calibrar" class="calibrar" aria-labelledby="calibrar-titulo">
    <form method="dialog" id="calibrar-form">
      <h2 id="calibrar-titulo">¿Quién va a hablar?</h2>
      <div id="calibrar-cuantos">
        <p class="nota">Si cada persona graba unos segundos su voz antes de empezar, la transcripción sale con su nombre.</p>
        <label class="cuantos">¿Cuántas personas son?
          <input id="calibrar-n" type="number" min="1" max="10" value="2" inputmode="numeric">
        </label>
      </div>
      <div id="calibrar-persona" hidden>
        <p class="paso" id="calibrar-paso"></p>
        <label>Nombre <input id="calibrar-nombre" autocomplete="off" maxlength="60" placeholder="Ej.: Lucas"></label>
        <p class="nota">Pídele que lea en voz alta, con el teléfono como va a quedar en la mesa:</p>
        <blockquote id="calibrar-frase"></blockquote>
        <div class="nivel" aria-hidden="true"><span id="calibrar-nivel"></span></div>
        <p class="estado-muestra" id="calibrar-estado" role="status"></p>
      </div>
      <p class="mensaje" id="calibrar-mensaje" role="alert"></p>
      <div class="botones">
        <button type="button" id="calibrar-saltar" class="secundario">Grabar sin nombres</button>
        <button type="button" id="calibrar-muestra" class="secundario" hidden>Grabar su voz (6 s)</button>
        <button type="button" id="calibrar-seguir" class="primario">Seguir</button>
      </div>
      <button type="button" id="calibrar-cerrar" class="cerrar" aria-label="Cancelar">×</button>
    </form>
  </dialog>
  <script type="module" src="/apps/reuniones.js"></script>
</body>
</html>
