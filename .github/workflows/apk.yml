# Compila el APK de Jarvis para Android (movil/) y lo deja en Actions → Artifacts.
# Corre a mano, con cada push a main que toque movil/ y en los PR que lo toquen.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["movil/**", ".github/workflows/apk.yml"]
  pull_request:
    paths: ["movil/**", ".github/workflows/apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: movil/package-lock.json
      # El SDK de Android ya viene en el runner; Capacitor 7 pide JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar el APK
        working-directory: movil/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: movil/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
