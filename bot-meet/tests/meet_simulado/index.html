<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Meet simulado</title></head>
<body>
<div id="previa">
  <button aria-label="Desactivar micrófono" onclick="this.dataset.apagado=1">mic</button>
  <button aria-label="Desactivar cámara" onclick="this.dataset.apagado=1">cam</button>
  <button id="unirse" onclick="pedir()">Pedir unirse</button>
</div>
<div id="espera" hidden>Pidiendo unirse...</div>
<div id="rechazo" hidden>Alguien de la llamada rechazó tu solicitud para unirte.</div>
<div id="llamada" hidden>
  <button aria-label="Más opciones" onclick="document.getElementById('menu').hidden=false">...</button>
  <div id="menu" role="menu" hidden>
    <div role="menuitem" onclick="document.getElementById('ajustes').hidden=false">Configuración</div>
  </div>
  <div id="ajustes" role="dialog" hidden>
    <button role="tab">Video</button>
    <!-- Como el Meet real: un menú propio con role=combobox, no un <select>. -->
    <div role="combobox" tabindex="0" aria-label="Resolución de recepción (máxima)" id="recepcion"
         onclick="document.getElementById('opciones').hidden=false">Alta definición (720p)</div>
    <ul role="listbox" id="opciones" hidden>
      <li role="option" onclick="elegir(this)">Alta definición (720p)</li>
      <li role="option" onclick="elegir(this)">Solo audio</li>
    </ul>
    <button aria-label="Cerrar diálogo" onclick="document.getElementById('ajustes').hidden=true">x</button>
  </div>
  <!-- Como el Meet real al entrar directo: micro y cámara quedan prendidos (?prendidos=1). -->
  <button id="micro-llamada" onclick="alternar(this, 'micrófono')"></button>
  <button id="camara-llamada" onclick="alternar(this, 'cámara')"></button>
  <button aria-label="Chatear con todos" onclick="document.getElementById('chat').hidden=!document.getElementById('chat').hidden">chat</button>
  <div id="chat" hidden>
    <textarea aria-label="Envía un mensaje" onkeydown="if(event.key==='Enter'){event.preventDefault();enviar(this)}"></textarea>
  </div>
  <ul id="mensajes"></ul>
  <div id="mosaico">
    <div data-participant-id="yo"><span data-self-name="Jarvis · Notas"></span></div>
    <div data-participant-id="p1"><span data-self-name="Ana"></span><i></i></div>
  </div>
  <button aria-label="Abandonar la llamada" onclick="salir()">colgar</button>
</div>
<div id="fuera" hidden>Saliste de la llamada</div>
<script>
const q = new URLSearchParams(location.search);
function pedir() {
  document.getElementById('previa').hidden = true;
  document.getElementById('espera').hidden = false;
  setTimeout(() => {
    document.getElementById('espera').hidden = true;
    document.getElementById(q.get('rechazar') ? 'rechazo' : 'llamada').hidden = false;
    // ?cartel=1: como Meet al entrar directo, un cartel encima que esconde la llamada
    // del árbol de accesibilidad (aria-hidden) hasta que se cierra con Escape.
    if (q.get('cartel')) {
      document.getElementById('llamada').setAttribute('aria-hidden', 'true');
      const c = document.createElement('div');
      c.id = 'cartel'; c.setAttribute('role', 'dialog'); c.textContent = 'Tu reunión está lista';
      document.body.append(c);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { c.remove(); document.getElementById('llamada').removeAttribute('aria-hidden'); }
      });
    }
  }, Number(q.get('admitir_ms') || 300));
}
function alternar(b, que) {
  const prendido = b.getAttribute('aria-label').startsWith('Desactivar');
  b.setAttribute('aria-label', `${prendido ? 'Activar' : 'Desactivar'} ${que} (ctrl + d)`);
}
for (const [id, que] of [['micro-llamada', 'micrófono'], ['camara-llamada', 'cámara']]) {
  document.getElementById(id).setAttribute('aria-label', `${q.get('prendidos') ? 'Desactivar' : 'Activar'} ${que} (ctrl + d)`);
}
function elegir(li) { document.getElementById('recepcion').textContent = li.textContent; document.getElementById('opciones').hidden = true; }
function enviar(t) { const li = document.createElement('li'); li.textContent = t.value; document.getElementById('mensajes').append(li); t.value=''; }
function salir() { document.getElementById('llamada').remove(); document.getElementById('fuera').hidden = false; }
window.hablar = (id, si) => { const i = document.querySelector(`[data-participant-id="${id}"] i`); if (si) i.setAttribute('data-hablando', '1'); else i.removeAttribute('data-hablando'); };
window.quitar = (id) => document.querySelector(`[data-participant-id="${id}"]`).remove();
</script>
</body></html>
